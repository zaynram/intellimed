#:schema ./firm-config.schema.json
# Trust Generator v3 — Workstation-local firm configuration.
#
# Firm-wide sections (firm, jurisdiction, estate_thresholds, trustee_catalog,
# diagnostics, guardianship, drafts) live in the OneDrive-synced shared file
# at CONVENTIONAL_SHARED_CONFIG_PATH (see firm-config-design §5.6.2 +
# shared-firm-config-design §5.2.2). This local file carries only the
# per-workstation [user] identity (and optional [meta] annotations).
#
# Env-var overlay: TGV3_<SECTION>__<KEY> (double underscore as nested
# delimiter). For dev/CI environments without OneDrive, point
# TGV3_FIRM_SHARED_CONFIG at config/firm.shared.dev.toml.

[meta]
# schema_version and comment are optional.
# Additional keys under [meta] are permitted (forward-compat seam).

[user]
# Per-workstation user identity (amendment A-5, 2026-04-24). The M365 account
# prefix is hand-set pre-onboarding and substituted into audit_log_dir
# (shared file) via the ${user.upn} sentinel (amendment A-6). Non-empty
# string required.
upn = "zramdass"
