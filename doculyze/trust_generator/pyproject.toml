[project]
name    = "trust-generator"
version = "2.2.0"

description = "Trust generator application deriving a simplified intake to document generation pipeline based on WealthCounsel."
readme      = "README.md"

dependencies    = ["python-docx", "pydantic>=2", "reportlab", "pypdf>=4"]
requires-python = ">=3.12"

    [project.scripts]
    trust-generator     = "trust_generator.app:main"
    trust-generator-cli = "trust_generator.dev:main"

    [project.gui-scripts]
    trust-generator-gui = "trust_generator.app:run_gui"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/trust_generator"]

[tool.ruff]
exclude = ["src/trust_generator/_legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
